<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaveformMatcher</title>
  <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="wfm.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2ea043;
      --bg: #f6f8fa;
      --card-bg: #fff;
      --text: #24292f;
      --sub-text: #57606a;
      --badge-bg: #ddf4ff;
      --badge-text: #0969da;
      --note-bg: #f8f9fa;
      --shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
      --border: #d0d7de;
      --warning: #bf8700;
      --warning-bg: #fff8c5;
      --code-bg: #ebf0f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --text: #c9d1d9;
        --sub-text: #8b949e;
        --badge-bg: rgba(56, 139, 253, 0.15);
        --badge-text: #58a6ff;
        --note-bg: #21262d;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        --border: #30363d;
        --warning: #d29922;
        --warning-bg: rgba(187, 128, 9, 0.15);
        --code-bg: #2d333b;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: min(100%, 1000px);
      max-width: 1000px;
      position: relative;
    }

    .lang-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    .lang-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--sub-text);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 600;
    }

    .lang-btn.active {
      background: var(--badge-text);
      color: #fff;
      border-color: var(--badge-text);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .app-logo {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
    }

    .tagline {
      color: var(--sub-text);
      font-size: 1rem;
      margin: 0.5rem 0 0;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2.5rem;
      align-items: start;
      min-width: 0;
    }

    @media (max-width: 850px) {
      body {
        padding: 0;
      }

      .card {
        width: 100%;
        max-width: none;
        padding: 1.25rem;
        border-radius: 0;
        box-shadow: none;
      }

      .main-content {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .header {
        padding-inline: 2.5rem;
      }
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .left-col,
    .right-col {
      min-width: 0;
    }

    .app-screenshot {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .section {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--sub-text);
    }

    .feature-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .feature-item {
      font-size: .85rem;
      display: flex;
      align-items: start;
      gap: 10px;
    }

    .feature-item i {
      color: var(--primary);
      margin-top: 3px;
    }

    .req-box,
    .manual-box {
      background: var(--note-bg);
      padding: 12px;
      border-radius: 8px;
      font-size: .8rem;
      border: 1px solid var(--border);
    }

    .manual-box {
      margin-bottom: 1.2rem;
      display: flex;
      justify-content: center;
    }

    .remark-box {
      background: var(--warning-bg);
      border: 1px solid var(--warning);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-size: .75rem;
      margin-top: 1.2rem;
      line-height: 1.5;
    }

    .remark-box code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 0.7rem;
      display: inline-block;
      margin-top: 5px;
      word-break: break-all;
      border: 1px solid var(--border);
    }

    .download-area {
      text-align: center;
      background: var(--note-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .download-btn {
      display: inline-block;
      background-color: var(--primary);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: .2s;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .download-btn:hover {
      background-color: #2c974b;
      transform: translateY(-1px);
    }

    .manual-btn {
      display: inline-block;
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: .2s;
      font-size: 0.9rem;
      width: 100%;
      box-sizing: border-box;
    }

    .manual-btn:hover {
      background-color: var(--card-bg);
      border-color: var(--sub-text);
    }

    .version-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 700;
    }

    .release-notes {
      text-align: left;
      font-size: .8rem;
      color: var(--sub-text);
      background: var(--card-bg);
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('th')">TH</button>
    </div>

    <div class="header">
      <img src="wfm.png" alt="Logo" class="app-logo">
      <h1>WaveformMatcher</h1>
      <p id="tagline" class="tagline"></p>
    </div>

    <div class="main-content">
      <div class="left-col">
        <img src="wfm_screenshot.png" alt="Screenshot" class="app-screenshot">
        <div class="section">
          <div class="section-title"><i class="fas fa-star"></i> <span id="feat-title"></span></div>
          <div id="features" class="feature-list"></div>
        </div>
      </div>

      <div class="right-col">
        <div class="download-area">
          <div id="release-info"><i>Checking updates...</i></div>
        </div>

        <div class="manual-box">
          <a href="UserManual.pdf" target="_blank" class="manual-btn" id="manual-btn-text">
            <i class="fas fa-book-open"></i> User Manual (PDF)
          </a>
        </div>

        <div class="section">
          <div class="section-title"><i class="fas fa-laptop"></i> <span id="req-title"></span></div>
          <div id="requirements" class="req-box"></div>
        </div>

        <div id="remark" class="remark-box"></div>

        <div style="text-align:center;margin-top:1.5rem">
          <a href="https://github.com/wtembundit/WaveformMatcher" target="_blank" style="color:var(--badge-text);text-decoration:none;font-size:.8rem;font-weight:600">
            <i class="fab fa-github"></i> View Repository on GitHub
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const owner = "wtembundit";
    const repo = "WaveformMatcher";
    let currentLang = "en";
    let releaseData = null;

    const i18n = {
      en: {
        tagline: "Match video to audio waveforms and export FCPXML",
        loading: "Checking updates...",
        published: "Released:",
        download: "Download for macOS",
        manual: "User Manual (PDF)",
        notes: "What's New:",
        error: "API Error",
        featTitle: "Capabilities",
        reqTitle: "System Requirements",
        remark: "<i class='fas fa-info-circle'></i> <strong>Privacy Note:</strong> This app is not notarized with Apple. If macOS blocks it:<br><strong>Option 1:</strong> Go to System Settings > Privacy & Security and click 'Open Anyway'.<br><strong>Option 2:</strong> Remove quarantine via Terminal:<br><code>xattr -dr com.apple.quarantine /Applications/WaveformMatcher.app</code>",
        features: [
          ["Waveform matching", "Compares audio fingerprints for automatic sync"],
          ["Timecode alignment", "Sync using embedded media timecode"],
          ["Lock Sync", "Manual mark offset with auto-lock indicators"],
          ["Export modes", "Supports Sync Clips and Multicam Clips"],
          ["Metadata", "Round-trips FCP studio tags and clip naming metadata"],
          ["Auto Speed", "Calculates slow-mo speed from recorded FPS"],
          ["Detect Slate guide", "Finds slate visible ranges and visual/audio guide candidates for review"],
          ["Workflow", "Workflow Extension, drag-and-drop FCPXML, and Send To Final Cut Pro"]
        ],
        requirements: "macOS 14.0+ (Apple Silicon / Intel) & Final Cut Pro"
      },
      th: {
        tagline: "ซิงค์วิดีโอกับเสียงและส่งออก FCPXML",
        loading: "กำลังตรวจสอบอัปเดต...",
        published: "วันที่ปล่อย:",
        download: "ดาวน์โหลดสำหรับ macOS",
        manual: "คู่มือการใช้งาน (PDF)",
        notes: "มีอะไรใหม่:",
        error: "เกิดข้อผิดพลาด",
        featTitle: "ความสามารถหลัก",
        reqTitle: "ความต้องการของระบบ",
        remark: "<i class='fas fa-info-circle'></i> <strong>Privacy Note:</strong> แอปนี้ไม่ได้ notarized โดย Apple หากถูกบล็อกการใช้งาน:<br><strong>วิธีที่ 1:</strong> ไปที่ System Settings > Privacy & Security แล้วกด 'Open Anyway'<br><strong>วิธีที่ 2:</strong> ปลดบล็อกผ่าน Terminal:<br><code>xattr -dr com.apple.quarantine /Applications/WaveformMatcher.app</code>",
        features: [
          ["Waveform matching", "เปรียบเทียบ Audio Fingerprints เพื่อซิงค์อัตโนมัติ"],
          ["Timecode alignment", "จัดวางคลิปด้วย Timecode ที่ฝังมาในไฟล์"],
          ["Lock Sync", "กำหนดจุดซิงค์ด้วยมือพร้อมระบบล็อคอัตโนมัติ"],
          ["โหมดการส่งออก", "รองรับทั้ง Sync Clips และ Multicam"],
          ["จัดการ Metadata", "ดึงค่า Studio Tags และ clip naming metadata จาก FCP กลับมา"],
          ["Auto Speed", "คำนวณความเร็วสโลว์จาก Recorded FPS"],
          ["Detect Slate guide", "หาช่วงที่น่าจะเห็น slate และ visual/audio guide เพื่อใช้ตรวจสอบ"],
          ["Workflow", "Workflow Extension, ลากวาง FCPXML, และ Send To Final Cut Pro"]
        ],
        requirements: "macOS 14.0 ขึ้นไป (Apple Silicon / Intel) & Final Cut Pro"
      }
    };

    async function fetchRelease() {
      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`);
        if (!response.ok) throw new Error();
        releaseData = await response.json();
        render();
      } catch (error) {
        document.getElementById("release-info").innerHTML = `<p style="color:red">${i18n[currentLang].error}</p>`;
      }
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.classList.toggle("active", button.innerText.toLowerCase() === lang);
      });
      document.getElementById("tagline").innerText = i18n[lang].tagline;
      document.getElementById("feat-title").innerText = i18n[lang].featTitle;
      document.getElementById("req-title").innerText = i18n[lang].reqTitle;
      document.getElementById("requirements").innerText = i18n[lang].requirements;
      document.getElementById("remark").innerHTML = i18n[lang].remark;
      document.getElementById("manual-btn-text").innerHTML = `<i class="fas fa-book-open"></i> ${i18n[lang].manual}`;
      const features = document.getElementById("features");
      features.innerHTML = i18n[lang].features.map((item) => (
        `<div class="feature-item"><i class="fas fa-check-circle"></i><div><strong>${item[0]}</strong>: ${item[1]}</div></div>`
      )).join("");
      render();
    }

    function render() {
      if (!releaseData) return;
      const releaseInfo = document.getElementById("release-info");
      const dmg = releaseData.assets.find((asset) => asset.name.endsWith(".dmg")) || releaseData.assets[0];
      const url = dmg ? dmg.browser_download_url : releaseData.html_url;
      const date = new Date(releaseData.published_at).toLocaleDateString(
        currentLang === "th" ? "th-TH" : "en-US"
      );

      releaseInfo.innerHTML = `
        <div>
          <span class="version-badge">${releaseData.tag_name}</span>
          <p style="margin:8px 0;font-size:.8rem;color:var(--sub-text)">${i18n[currentLang].published} ${date}</p>
        </div>
        <a href="${url}" class="download-btn"><i class="fab fa-apple"></i> ${i18n[currentLang].download}</a>
        <div class="release-notes"><strong>${i18n[currentLang].notes}</strong><br>${releaseData.body.replace(/\n/g, "<br>")}</div>
      `;
    }

    setLang("en");
    fetchRelease();
  </script>
</body>
</html>
